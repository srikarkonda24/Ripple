<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ripple — Call Graph</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #graph {
      width: 100vw;
      height: 100vh;
    }

    #toolbar {
      position: fixed;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    #back-btn {
      display: none;
      padding: 8px 14px;
      background: rgba(20, 20, 20, 0.9);
      border: 1px solid #262626;
      border-radius: 6px;
      color: #d4d4d4;
      font-size: 13px;
      cursor: pointer;
    }

    #back-btn:hover {
      background: #1a1a1a;
      border-color: #404040;
      color: #f5f5f5;
    }

    #status {
      color: #a3a3a3;
      font-size: 13px;
      pointer-events: none;
    }

    #legend {
      position: fixed;
      bottom: 16px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 40vh;
      overflow-y: auto;
      padding: 12px 14px;
      background: rgba(20, 20, 20, 0.9);
      border: 1px solid #262626;
      border-radius: 8px;
      z-index: 10;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #d4d4d4;
    }

    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    #error {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      color: #fca5a5;
      font-size: 15px;
      padding: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="back-btn" type="button">← Back to overview</button>
    <div id="status">Loading graph…</div>
  </div>
  <div id="graph"></div>
  <div id="legend"></div>
  <div id="error"></div>

  <script>
    const PALETTE = [
      "#6366f1", "#22d3ee", "#34d399", "#fbbf24", "#f472b6",
      "#a78bfa", "#fb923c", "#38bdf8", "#4ade80", "#e879f9",
      "#2dd4bf", "#facc15", "#818cf8", "#67e8f9", "#86efac",
    ];

    const GROUP_PREFIX = "__group__:";

    const detailOptions = {
      physics: {
        enabled: true,
        stabilization: { iterations: 200 },
        barnesHut: {
          gravitationalConstant: -4000,
          springLength: 120,
          springConstant: 0.04,
        },
      },
      interaction: {
        dragNodes: true,
        dragView: true,
        zoomView: true,
        hover: true,
      },
      nodes: {
        shape: "dot",
        size: 16,
        borderWidth: 2,
      },
      edges: {
        width: 1,
        smooth: { type: "continuous" },
      },
    };

    const overviewOptions = {
      physics: {
        enabled: true,
        stabilization: { iterations: 150 },
        barnesHut: {
          gravitationalConstant: -8000,
          springLength: 200,
          springConstant: 0.02,
        },
      },
      interaction: {
        dragNodes: true,
        dragView: true,
        zoomView: true,
        hover: true,
      },
      nodes: {
        shape: "dot",
        borderWidth: 3,
        font: { color: "#f5f5f5", size: 15, face: "system-ui, sans-serif" },
      },
      edges: {
        width: 2,
        smooth: { type: "continuous" },
      },
    };

    function getFolderGroup(filePath) {
      const dir = filePath.includes("/")
        ? filePath.slice(0, filePath.lastIndexOf("/"))
        : filePath;
      const parts = dir.split("/");
      if (parts.length >= 2) return parts.slice(0, 2).join("/");
      return parts[0];
    }

    function groupNodeId(group) {
      return `${GROUP_PREFIX}${group}`;
    }

    function isGroupNodeId(id) {
      return id.startsWith(GROUP_PREFIX);
    }

    function groupFromNodeId(id) {
      return id.slice(GROUP_PREFIX.length);
    }

    function buildColorMap(nodes) {
      const groups = [...new Set(nodes.map((n) => getFolderGroup(n.file)))].sort();
      const colorMap = {};
      groups.forEach((group, i) => {
        colorMap[group] = PALETTE[i % PALETTE.length];
      });
      return { colorMap, groups };
    }

    function buildNodeToGroup(nodes) {
      const map = new Map();
      for (const node of nodes) {
        map.set(node.id, getFolderGroup(node.file));
      }
      return map;
    }

    function nodeColor(colorMap, group) {
      const color = colorMap[group];
      return {
        background: color,
        border: color,
        highlight: { background: color, border: "#ffffff" },
        hover: { background: color, border: "#e5e5e5" },
      };
    }

    function groupNodeSize(count) {
      return Math.min(90, Math.max(28, 18 + Math.sqrt(count) * 10));
    }

    function buildOverviewGraph(data, colorMap, groups, nodeToGroup) {
      const membersByGroup = {};
      for (const group of groups) {
        membersByGroup[group] = [];
      }
      for (const node of data.nodes) {
        const group = nodeToGroup.get(node.id);
        if (group) membersByGroup[group].push(node);
      }

      const nodes = groups.map((group) => {
        const count = membersByGroup[group].length;
        return {
          id: groupNodeId(group),
          label: `${group}/\n${count} fn${count === 1 ? "" : "s"}`,
          group,
          size: groupNodeSize(count),
          color: nodeColor(colorMap, group),
          title: `${group}/\n${count} function${count === 1 ? "" : "s"}\nClick to explore`,
        };
      });

      const edgeSet = new Set();
      const edges = [];
      for (const edge of data.edges) {
        const fromGroup = nodeToGroup.get(edge.from);
        const toGroup = nodeToGroup.get(edge.to);
        if (!fromGroup || !toGroup || fromGroup === toGroup) continue;

        const key = `${fromGroup}->${toGroup}`;
        if (edgeSet.has(key)) continue;
        edgeSet.add(key);

        edges.push({
          id: key,
          from: groupNodeId(fromGroup),
          to: groupNodeId(toGroup),
          arrows: "to",
          color: { color: "#525252", highlight: "#a3a3a3", hover: "#737373" },
        });
      }

      return { nodes, edges };
    }

    function buildDetailGraph(data, colorMap, nodeToGroup, filterGroup) {
      const nodeIds = new Set();
      const filteredEdges = [];

      for (const edge of data.edges) {
        const fromGroup = nodeToGroup.get(edge.from);
        const toGroup = nodeToGroup.get(edge.to);
        if (fromGroup === filterGroup || toGroup === filterGroup) {
          filteredEdges.push(edge);
          nodeIds.add(edge.from);
          nodeIds.add(edge.to);
        }
      }

      for (const node of data.nodes) {
        if (nodeToGroup.get(node.id) === filterGroup) {
          nodeIds.add(node.id);
        }
      }

      const nodes = data.nodes
        .filter((node) => nodeIds.has(node.id))
        .map((node) => {
          const group = nodeToGroup.get(node.id);
          return {
            id: node.id,
            label: node.id,
            group,
            color: nodeColor(colorMap, group),
            font: { color: "#f5f5f5", size: 14 },
            title: `${node.id}\n${node.file}`,
          };
        });

      const edges = filteredEdges.map((edge, i) => ({
        id: i,
        from: edge.from,
        to: edge.to,
        arrows: "to",
        color: { color: "#525252", highlight: "#a3a3a3", hover: "#737373" },
      }));

      return { nodes, edges };
    }

    function renderLegend(groups, colorMap) {
      const legend = document.getElementById("legend");
      legend.innerHTML = groups
        .map(
          (group) =>
            `<div class="legend-item">
              <span class="legend-swatch" style="background:${colorMap[group]}"></span>
              <span>${group}/</span>
            </div>`
        )
        .join("");
    }

    function showError(message) {
      document.getElementById("status").style.display = "none";
      const errorEl = document.getElementById("error");
      errorEl.textContent = message;
      errorEl.style.display = "flex";
    }

    async function init() {
      let data;
      try {
        const response = await fetch("output.json");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        data = await response.json();
      } catch (err) {
        showError(
          "Could not load output.json. Serve this folder over HTTP (e.g. npx serve .) — fetch does not work from file:// URLs."
        );
        console.error(err);
        return;
      }

      const { colorMap, groups } = buildColorMap(data.nodes);
      const nodeToGroup = buildNodeToGroup(data.nodes);
      renderLegend(groups, colorMap);

      const container = document.getElementById("graph");
      const backBtn = document.getElementById("back-btn");
      const statusEl = document.getElementById("status");

      let mode = "overview";
      let selectedGroup = null;

      const network = new vis.Network(container, { nodes: [], edges: [] }, overviewOptions);

      function updateStatus(text) {
        statusEl.textContent = text;
      }

      function showOverview() {
        mode = "overview";
        selectedGroup = null;
        backBtn.style.display = "none";

        const graph = buildOverviewGraph(data, colorMap, groups, nodeToGroup);
        network.setOptions(overviewOptions);
        network.setData({
          nodes: new vis.DataSet(graph.nodes),
          edges: new vis.DataSet(graph.edges),
        });

        updateStatus(
          `${graph.nodes.length} groups · ${graph.edges.length} connections`
        );
      }

      function showDetail(group) {
        mode = "detail";
        selectedGroup = group;
        backBtn.style.display = "block";

        const graph = buildDetailGraph(data, colorMap, nodeToGroup, group);
        network.setOptions(detailOptions);
        network.setData({
          nodes: new vis.DataSet(graph.nodes),
          edges: new vis.DataSet(graph.edges),
        });

        updateStatus(
          `${group}/ — ${graph.nodes.length} nodes · ${graph.edges.length} edges`
        );
      }

      network.on("click", (params) => {
        if (mode !== "overview" || params.nodes.length !== 1) return;
        const nodeId = params.nodes[0];
        if (isGroupNodeId(nodeId)) {
          showDetail(groupFromNodeId(nodeId));
        }
      });

      network.on("doubleClick", (params) => {
        if (mode === "overview" && params.nodes.length === 1 && isGroupNodeId(params.nodes[0])) {
          showDetail(groupFromNodeId(params.nodes[0]));
        }
      });

      backBtn.addEventListener("click", showOverview);

      showOverview();
    }

    init();
  </script>
</body>
</html>
